<!DOCTYPE html>

<head>
<meta charset="utf-8">
<title>Logo comparison: Brandfetch vs Local PNG</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f5f5f5; padding: 24px; }
  h1 { font-size: 16px; margin-bottom: 20px; color: #111; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .card { background: white; border-radius: 8px; border: 1px solid #e5e5e5; padding: 12px; }
  .name { font-size: 11px; font-weight: 600; color: #333; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .label { font-size: 10px; color: #999; width: 70px; flex-shrink: 0; }
  img { width: 36px; height: 36px; object-fit: contain; border-radius: 50%; background: #fafafa; border: 1px solid #eee; }
  .missing { width: 36px; height: 36px; border-radius: 50%; background: #f0f0f0; display: flex; align-items: center; justify-content: center; font-size: 9px; color: #999; border: 1px solid #eee; flex-shrink: 0; }
  .match { border-left: 3px solid #22c55e; }
  .mismatch { border-left: 3px solid #f59e0b; }
</style>
</head>
<body>

const LOCAL_BASE = "http://localhost:5176/vts_lookfeel_nav_concept_1-0/logos/";
const grid = document.getElementById("grid");

tenants.forEach(([name, domain, file]) => {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `<div class="name" title="${name}">${name}</div>`;

  // Brandfetch row
  const bfRow = document.createElement("div");
  bfRow.className = "row";
  bfRow.innerHTML = `<span class="label">Brandfetch</span>`;
  if (domain) {
    const img = document.createElement("img");
    img.src = `https://cdn.brandfetch.io/${domain}/w/128/h/128`;
    img.onerror = () => { img.replaceWith(Object.assign(document.createElement("div"), { className: "missing", textContent: "none" })); };
    bfRow.appendChild(img);
  } else {
    bfRow.innerHTML += `<div class="missing">no domain</div>`;
  }
  card.appendChild(bfRow);

  // Local row
  const localRow = document.createElement("div");
  localRow.className = "row";
  localRow.innerHTML = `<span class="label">Local PNG</span>`;
  const localImg = document.createElement("img");
  localImg.src = `${LOCAL_BASE}${file}`;
  localImg.onerror = () => { localImg.replaceWith(Object.assign(document.createElement("div"), { className: "missing", textContent: "missing" })); };
  localRow.appendChild(localImg);
  card.appendChild(localRow);

  grid.appendChild(card);
});
</script>
